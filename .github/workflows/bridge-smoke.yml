name: bridge-smoke

on:
  push:
    paths:
      - "apps/notebooklm-social-agent-bridge/**"
      - ".github/workflows/bridge-smoke.yml"
  pull_request:
    paths:
      - "apps/notebooklm-social-agent-bridge/**"
      - ".github/workflows/bridge-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/notebooklm-social-agent-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run bridge smoke tests
        run: bash scripts/smoke.sh
